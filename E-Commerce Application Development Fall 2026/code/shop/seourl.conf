# Readable URLs for the teaching shop -- Chapter 21.
#
# OpenCart's readable URLs are TWO halves, and only one of them is a setting.
#
#   The application half turns config_seo_url on, looks each link up in
#   oc_seo_url, and emits /en-gb/catalog/desktops instead of
#   index.php?route=product/category&path=20. It works perfectly.
#
#   The server half must turn /en-gb/catalog/desktops back into
#   index.php?_route_=en-gb/catalog/desktops before PHP ever sees it. That
#   is a rewrite, it ships in .htaccess.txt, and Chapter 16 measured Apache
#   as never reading .htaccess files on this stack at all.
#
# So switching the setting on without this file makes every link in the shop
# point at a 404 -- while the shop itself continues to work for anybody who
# types index.php?route=... by hand. The first measurement in Chapter 21 is
# that failure, reproduced.
#
# Enable:  docker compose exec shop a2enconf zz-seourl-ecad && \
#          docker compose exec shop apachectl -k graceful
#
# Then turn config_seo_url on at System > Settings > Edit > Server.
# Both halves, or neither.

<Directory /var/www/html>
    RewriteEngine On

    # Leave real files and directories alone: images, stylesheets, scripts
    # and the admin panel must keep working. Without these two conditions
    # the rule below swallows every asset on the site and the shop renders
    # as unstyled text -- which looks like a theme fault and is not.
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d

    # Anything else becomes a _route_ for index.php to resolve against
    # oc_seo_url. QSA keeps any query string the visitor already had; L
    # stops rewriting here.
    RewriteRule ^([^?]*) index.php?_route_=$1 [L,QSA]
</Directory>
