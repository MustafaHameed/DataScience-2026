# Apache hardening for the teaching shop -- Chapter 16.
#
# WHY THIS IS A SERVER CONFIG AND NOT A .htaccess FILE
#
# Every guide to securing this platform says: rename .htaccess.txt to
# .htaccess. That advice is twenty years old and, on this stack, it does
# nothing at all. Debian's apache2.conf sets "AllowOverride None" for the
# document root, so Apache does not read .htaccess files, so renaming the
# file changes nothing -- and because nothing visibly breaks, you would
# never find out. The protections have to be stated where the server will
# actually read them.
#
# This file is not enabled by default. Chapter 16 measures the shop without
# it, applies it, and measures again, because a hardening step you cannot
# show the effect of is a hardening step nobody will keep.
#
# Enable:   docker compose exec shop a2enconf security && \
#           docker compose exec shop apachectl -k graceful
# Disable:  docker compose exec shop a2disconf security && ...
#
# To make it permanent, copy it in from the Dockerfile instead. It is left
# out of the image on purpose so that the chapter has something to do.

# ---------------------------------------------------------------------
# 1. Stop telling everyone what you are running.
#
# A version number is not a vulnerability. It is a search term: it turns
# "try everything" into "try the four things that work on this version",
# which is the difference between an attack that is worth someone's time
# and one that is not.
# ---------------------------------------------------------------------
# ServerTokens is read only when Apache STARTS. A graceful reload applies
# every other directive in this file and silently ignores this one, so a
# check run after a reload reports the version still showing and you go
# looking for a typo that is not there.
ServerTokens Prod
ServerSignature Off
Header always unset X-Powered-By
Header unset X-Powered-By

# ---------------------------------------------------------------------
# 2. The storage directory, which should not be in the web root at all.
#
# The stock install puts system/storage inside the document root. It holds
# the error log, the session files, uploaded files and the cache. The
# shipped .htaccess.txt tries to block it -- and is never read. Without
# this block, http://your-shop/system/storage/logs/error.log serves the
# PHP error log to anyone who asks, and a PHP error log contains file
# paths, SQL fragments and sometimes the contents of a request.
#
# Blocking it is the fix you can apply today. MOVING it outside the web
# root is the fix that is still correct when somebody changes this file.
# ---------------------------------------------------------------------
<DirectoryMatch "^/var/www/html/(system|storage)">
    Require all denied
</DirectoryMatch>

<FilesMatch "\.(log|sql|ini|sh|bak|old|dist|txt~)$">
    Require all denied
</FilesMatch>

# The installer's own directory, and anything a careless deploy leaves.
<DirectoryMatch "^/var/www/html/(install|\.git|\.svn)">
    Require all denied
</DirectoryMatch>

# ---------------------------------------------------------------------
# 3. No directory listings, anywhere.
# ---------------------------------------------------------------------
<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
</Directory>

# ---------------------------------------------------------------------
# 4. Response headers the browser enforces for you.
#
# Each of these asks the BROWSER to refuse something. They cost nothing,
# they are a single line each, and not one of them ships enabled.
# ---------------------------------------------------------------------

# Do not guess that a .txt file is really JavaScript. This is the header
# that makes Chapter 7's upload findings much less dangerous.
Header always set X-Content-Type-Options "nosniff"

# Refuse to be framed by another site -- the clickjacking defence.
Header always set X-Frame-Options "SAMEORIGIN"

# Do not send the full URL of this page to other sites. A password-reset
# link in a Referer header is how reset tokens leak.
Header always set Referrer-Policy "strict-origin-when-cross-origin"

# Switch off browser features the shop does not use.
Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"

# A content security policy that the stock theme can actually live with.
# 'unsafe-inline' is here because the shipped templates use inline scripts
# and styles; removing it is a theme project, not a header change, and
# Chapter 16 says so rather than publishing a policy that breaks the shop.
Header always set Content-Security-Policy "default-src 'self'; \
img-src 'self' data:; \
script-src 'self' 'unsafe-inline'; \
style-src 'self' 'unsafe-inline'; \
font-src 'self' data:; \
frame-ancestors 'self'; \
form-action 'self'; \
base-uri 'self'; \
object-src 'none'"

# NOTE: Strict-Transport-Security is deliberately NOT set here. It tells a
# browser to refuse plain HTTP to this host for months, and this shop is
# served over plain HTTP on localhost. Setting it would make the teaching
# stack unreachable in your browser until the cache expired. Chapter 20
# turns it on where there is a certificate to turn it on for.

# ---------------------------------------------------------------------
# 5. The CORS headers the application sets on every response.
#
# The stock install answers every request with
#   Access-Control-Allow-Origin: *
#   Access-Control-Allow-Credentials: true
# which asks browsers to let any website on the internet read responses
# from this shop using the visitor's own session. Browsers reject that
# exact pair, so it is not immediately exploitable -- but it is a clear
# statement of intent by whoever wrote it, and the API it was added for is
# not one this shop uses.
# ---------------------------------------------------------------------
# Both forms of each. mod_headers keeps two tables: "always" applies to
# every response including errors, and the default one applies only to
# successful responses. A header PHP sets on a 200 lives in the second
# table, so "Header always unset" alone silently does nothing to it --
# which is exactly what happened the first time this file was written, and
# the measurement caught it.
Header always unset Access-Control-Allow-Origin
Header unset Access-Control-Allow-Origin
Header always unset Access-Control-Allow-Credentials
Header unset Access-Control-Allow-Credentials
Header always unset Access-Control-Allow-Methods
Header unset Access-Control-Allow-Methods
Header always unset Access-Control-Allow-Headers
Header unset Access-Control-Allow-Headers
Header always unset Access-Control-Max-Age
Header unset Access-Control-Max-Age
