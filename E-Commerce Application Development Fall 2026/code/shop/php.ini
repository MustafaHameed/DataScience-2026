; PHP settings for the teaching shop.
;
; Deliberately close to a cheap shared-hosting account rather than generous:
; a student whose laptop has 16 GB should still meet the limits a real small
; shop meets, because Chapter 7 (image uploads) and Chapter 20 (performance)
; are only interesting when something can actually run out.

memory_limit = 256M
upload_max_filesize = 8M
post_max_size = 10M
max_execution_time = 60

; Errors go to the log, never to the browser. Showing a PHP error to a
; visitor leaks file paths and sometimes credentials; Chapter 16 measures
; exactly that, by turning this back on and looking at what appears.
display_errors = Off
log_errors = On
error_reporting = E_ALL

; Sessions are the basket (Chapter 9) and the login (Chapter 15).
session.cookie_httponly = 1
session.use_strict_mode = 1

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
